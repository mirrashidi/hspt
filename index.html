<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSPT Prep Quest</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#243247;--line:#334155;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--good:#22c55e;--bad:#ef4444;--gold:#fbbf24;--purple:#a78bfa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 50% -20%,#1e3a5f,#0f172a 65%) fixed;color:var(--text);min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(15,23,42,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;cursor:pointer;margin-right:auto}
.logo span{color:var(--gold)}
.pill{background:var(--card);padding:6px 12px;border-radius:999px;font-size:14px;display:flex;gap:8px;align-items:center;border:1px solid var(--line)}
.pill.click{cursor:pointer}
.xpbar{width:120px;height:8px;background:#0b1220;border-radius:9px;overflow:hidden}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width .5s}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{margin:.2em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.tile{cursor:pointer;transition:transform .15s,border-color .15s;position:relative}
.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
.tile .ic{font-size:34px}
.tile h3{margin:8px 0 4px;font-size:18px}
.tile.feature{background:linear-gradient(135deg,#3b2a0a,#1e293b 70%);border-color:#a16207}
.tile.mock{background:linear-gradient(135deg,#1e1b4b,#1e293b 70%);border-color:#6d28d9}
.best{position:absolute;top:14px;right:14px;font-size:13px;background:#0f172a;border-radius:999px;padding:3px 9px;color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{background:var(--accent);color:#04121f;border:0;border-radius:10px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.sec{background:#334155;color:var(--text)}
.btn.good{background:var(--good)}
.btn.warn{background:var(--gold)}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{background:var(--card2);border:2px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--text);font-size:14px;font-family:inherit}
.chip.on{border-color:var(--accent);background:#0c4a6e}
.lab{font-weight:700;margin-top:6px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card2);border:2px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:17px;line-height:1.4;cursor:pointer;font-family:inherit}
.choice .lt{flex:none;width:28px;height:28px;border-radius:50%;background:#0f172a;display:grid;place-items:center;font-weight:700;font-size:14px}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:#0c4a6e}
.choice.ok{border-color:var(--good);background:#14532d}
.choice.no{border-color:var(--bad);background:#7f1d1d}
.choice:disabled{cursor:default}
.passage{background:#f8fafc;color:#0f172a;border-radius:12px;padding:16px 22px;line-height:1.65;max-height:360px;overflow:auto;font-family:Georgia,"Times New Roman",serif;font-size:16px;margin-bottom:14px}
.passage h4{margin:0 0 6px;text-align:center}
.passage p{margin:.5em 0;text-indent:1.5em}
.prompt{font-size:19px;line-height:1.5;margin:4px 0 10px}
.sent{background:#0f172a;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:18px;line-height:1.5}
.abc{display:grid;gap:6px;background:#0f172a;border-radius:10px;padding:12px 16px;margin:10px 0;font-size:18px}
.figs{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
.figs>div{text-align:center;font-weight:700}
.figs svg{display:block;background:#0f172a;border-radius:8px;padding:4px}
.fb{border-radius:12px;padding:12px 16px;margin-top:12px;line-height:1.55}
.fb.ok{background:rgba(34,197,94,.14);border:1px solid var(--good)}
.fb.no{background:rgba(239,68,68,.12);border:1px solid var(--bad)}
.hl b{color:var(--gold);text-decoration:underline}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.prog{height:8px;background:#0b1220;border-radius:9px;overflow:hidden;margin-bottom:14px}
.prog>div{height:100%;background:linear-gradient(90deg,var(--good),var(--accent));transition:width .3s}
.timer.low{color:var(--bad);font-weight:800;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
input.type{font-size:24px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:#0f172a;color:var(--text);width:100%;max-width:420px;font-family:inherit;letter-spacing:.04em}
input.type:focus{outline:none;border-color:var(--accent)}
input.name{font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#0f172a;color:var(--text)}
.big{font-size:64px;font-weight:800;line-height:1}
.stars{font-size:40px;letter-spacing:6px}
.rev{border-left:4px solid var(--line);padding:10px 14px;margin:10px 0;background:var(--card2);border-radius:0 10px 10px 0}
.rev.ok{border-color:var(--good)}
.rev.no{border-color:var(--bad)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{background:var(--card2);border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line)}
.badge .bi{font-size:32px}
.badge.locked{opacity:.35;filter:grayscale(1)}
.bar{height:10px;background:#0b1220;border-radius:9px;overflow:hidden;flex:1}
.bar>div{height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--gold);color:#1c1300;font-weight:800;padding:12px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;animation:pop .3s}
.xpfloat{position:fixed;font-weight:900;color:var(--gold);font-size:22px;pointer-events:none;z-index:40;animation:float 1s forwards}
@keyframes float{to{transform:translateY(-60px);opacity:0}}
@keyframes pop{from{transform:translateX(-50%) scale(.6)}to{transform:translateX(-50%) scale(1)}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.rule h3{color:var(--gold)}
.rule li{margin:4px 0;line-height:1.5}
kbd{background:#0f172a;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:12px}
@media (max-width:600px){.xpbar{width:70px}.prompt{font-size:17px}.big{font-size:48px}}
</style>
</head>

// Build a multiple-choice question. Shuffles unless explicit choices are given.
function mc(o) {
  if (!o.choices) {

    o.choices = shuffle([c, ...w]);

}
// Numeric distractors: plausible mistakes first, then nearby numbers.
function nd(ans, extras = [], steps) {
  const out = [], seen = new Set([String(ans)]);
  const add = v => {
    if (v == null || !isFinite(v)) return;
    v = Math.round(v * 100) / 100;
    if (v < 0 && ans >= 0) return;
    if (Number.isInteger(ans) && !Number.isInteger(v)) return;
    const k = String(v);
    if (!seen.has(k)) { seen.add(k); out.push(v); }
  };
  shuffle(extras).forEach(add);
  shuffle(steps || [1, -1, 2, -2, 3, -3, 4, 5, -5, 10, -10]).forEach(s => add(ans + s));

  return out.slice(0, 3);
}
function fr(n, d) {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d); n /= g; d /= g;

  const out = new Set();

  const fb = [w.replace('ie', 'ee'), w.replace('ei', 'ee'), w + w.slice(-1), w.replace(/e$/, 'a'), w.replace(/([aeiou])/, '$1$1')];
  fb.forEach(f => { if (f !== w && !res.includes(f)) res.push(f); });
  return res;
}

// --- Spelling
function spellHSPT(cat, sec = 'spelling') {
  const ws = draw(poolFor(cat), 3);
  const err = Math.random() < 0.78 ? rnd(0, 2) : 3;
  const choices = ws.map((o, i) => esc(fillS(o.s, i === err ? o.x : o.w)));
  choices.push('No mistake');
  let explain;
  if (err < 3) { const o = ws[err]; explain = `Sentence ${LET[err]} misspells <b>${o.x}</b>. Correct spelling: <span class="hl">${hl(o.w, o.cat)}</span>.<br><span class="small muted">${SPELL[o.cat].tip}</span>`; }
  else explain = `No mistakes! All three words are spelled correctly: <span class="hl">${ws.map(o => hl(o.w, o.cat)).join(', ')}</span>.`;
  return { sec, sub: 'spell', cat: err < 3 ? ws[err].cat : ws[0].cat, prompt: 'Look for errors in <b>spelling</b>. If there is no mistake, choose D.', choices, answer: err, explain };
}

function seriesQ() {

    case 0: { const s = rnd(1, 20), d = pick([2, 3, 4, 5, 6, 7, 8, 9, 11, 12]); seq = rep(6, 0).map((_, i) => s + i * d); rule = `add ${d} each time`; extra = [seq[5] + 1, seq[5] - d]; break; }
    case 1: { const s = rnd(60, 99), d = pick([3, 4, 5, 6, 7, 8, 9]); seq = rep(6, 0).map((_, i) => s - i * d); rule = `subtract ${d} each time`; extra = [seq[5] + d * 2, seq[5] - 1]; break; }
    case 2: { const s = pick([1, 2, 3, 4, 5]), r = pick([2, 3]), len = r === 2 ? 6 : 5; seq = rep(len, 0).map((_, i) => s * r ** i); rule = `multiply by ${r} each time`; const p = seq[len - 2]; extra = [p + (p - seq[len - 3]), p * 2 + r, seq[len - 1] / 2]; break; }
    case 3: { const s = rnd(1, 10), d = rnd(1, 4), k = pick([1, 2]); seq = [s]; let diff = d; for (let i = 1; i < 6; i++) { seq.push(seq[i - 1] + diff); diff += k; } rule = `the amount added grows by ${k} each time (+${d}, +${d + k}, +${d + 2 * k}, …)`; extra = [seq[4] + (seq[4] - seq[3])]; break; }
    case 4: { const a = rnd(3, 7), b = rnd(1, a - 1), s = rnd(1, 15); seq = [s]; for (let i = 1; i < 7; i++) seq.push(seq[i - 1] + (i % 2 ? a : -b)); rule = `alternate: add ${a}, then subtract ${b}`; extra = [seq[5] - b, seq[6] - a - b]; break; }
    case 5: { const s1 = rnd(1, 10), d1 = rnd(2, 5), s2 = rnd(30, 50), d2 = rnd(2, 5); seq = []; for (let i = 0; i < 7; i++) seq.push(i % 2 ? s2 - ((i - 1) / 2) * d2 : s1 + (i / 2) * d1); rule = `two series are mixed together: the 1st, 3rd, 5th… numbers add ${d1}; the 2nd, 4th, 6th… numbers subtract ${d2}`; extra = [seq[5] - d2, seq[4] + d1 + 1]; break; }
    case 6: { const o = pick([0, 1, -1]), st = rnd(1, 4); seq = rep(6, 0).map((_, i) => (st + i) ** 2 + o); rule = `square numbers${o ? (o > 0 ? ' plus 1' : ' minus 1') : ''} (${st}², ${st + 1}², ${st + 2}², …)`; extra = [seq[4] + (seq[4] - seq[3])]; break; }
    case 7: { const a = pick([2, 3]), b = pick([1, 2, 3]), s = rnd(1, 4); seq = [s]; for (let i = 1; i < 6; i++) seq.push(i % 2 ? seq[i - 1] * a : seq[i - 1] + b); rule = `alternate: multiply by ${a}, then add ${b}`; extra = [seq[4] + b, seq[4] * a + b]; break; }
  }
  const blank = [0, 1, 2, 6].includes(t) && Math.random() < 0.3;
  let shown, ans, prompt;
  if (blank) {
    const bi = rnd(2, seq.length - 2); ans = seq[bi];
    shown = seq.map((v, i) => i === bi ? '____' : v).join(', ');
    prompt = `Look at this series: <b>${shown}</b>. What number should fill the blank in the series?`;

  }
  return mc({ sec: 'quant', sub: 'series', prompt, correct: ans, wrong: nd(ans, extra), explain: `The rule: ${rule}. Full series: ${seq.join(', ')}.` });
}

// --- Quantitative: comparisons
const L3 = ['A', 'B', 'C'];
function statementsFor(v) {
  const eq = (x, y) => Math.abs(v[x] - v[y]) < 1e-9, gt = (x, y) => v[x] - v[y] > 1e-9;
  const S = [], I = [0, 1, 2];
  for (const x of I) for (const y of I) if (x !== y) {
    S.push({ t: `(${L3[x]}) is greater than (${L3[y]})`, ok: gt(x, y), c: 0 });
    if (x < y) S.push({ t: `(${L3[x]}) is equal to (${L3[y]})`, ok: eq(x, y), c: 0 });
  }
  S.push({ t: '(A), (B), and (C) are equal', ok: eq(0, 1) && eq(1, 2), c: 1 });
  for (const x of I) for (const y of I) for (const z of I) if (x !== y && y !== z && x !== z)
    S.push({ t: `(${L3[x]}) is greater than (${L3[y]}) and less than (${L3[z]})`, ok: gt(x, y) && gt(z, x), c: 1 });
  for (const [x, y] of [[0, 1], [0, 2], [1, 2]]) {
    const z = 3 - x - y;
    S.push({ t: `(${L3[x]}) and (${L3[y]}) are equal, and both are greater than (${L3[z]})`, ok: eq(x, y) && gt(x, z), c: 1 });
    S.push({ t: `(${L3[x]}) and (${L3[y]}) are equal, and both are less than (${L3[z]})`, ok: eq(x, y) && gt(z, x), c: 1 });
  }
  return S;
}
function compChoices(v) {
  const S = statementsFor(v), T = S.filter(s => s.ok), F = S.filter(s => !s.ok);
  const tc = T.filter(s => s.c);
  const t = tc.length && Math.random() < 0.65 ? pick(tc) : pick(T);
  const wrong = [...shuffle(F.filter(s => s.c)).slice(0, 2), ...shuffle(F.filter(s => !s.c)).slice(0, 1)];
  return { correct: t.t, wrong: wrong.map(s => s.t) };
}
function valuePattern(pool) {
  const p = pick(['d', 'd', 'two', 'two', 'all']);
  const a = pick(pool); let b, c;
  const other = x => { let y; do { y = pick(pool); } while (Math.abs(y - x) < 1e-9); return y; };
  if (p === 'all') { b = a; c = a; }
  else if (p === 'two') { b = a; c = other(a); }
  else { b = other(a); do { c = pick(pool); } while (Math.abs(c - a) < 1e-9 || Math.abs(c - b) < 1e-9); }
  return shuffle([a, b, c]);
}
function exprFor(v) {
  const o = [];
  if (v > 3) { const a = rnd(1, v - 1); o.push(`${a} + ${v - a}`); }
  const b = rnd(2, 15); o.push(`${v + b} − ${b}`);
  const divs = [2, 3, 4, 5, 6].filter(k => v % k === 0 && v / k > 1);
  if (divs.length) {
    const k = pick(divs); o.push(`${k} × ${v / k}`);
    const q = v / k; if (q >= 3) { const x = rnd(1, q - 1); o.push(`(${x} + ${q - x}) × ${k}`); }
  }
  const k2 = rnd(2, 6); o.push(`${v * k2} ÷ ${k2}`);
  const k3 = rnd(2, 5); o.push(`1/${k3} of ${v * k3}`);
  [10, 20, 25, 50].forEach(p => { if ((v * 100) % p === 0 && v * 100 / p <= 200) o.push(`${p}% of ${v * 100 / p}`); });
  if (v <= 15) o.push(`√${v * v}`);
  const s = Math.floor(Math.sqrt(v)); if (s >= 2) o.push(v - s * s ? `${s}² + ${v - s * s}` : `${s}²`);
  return pick(o);
}
function compQ() {
  const v = valuePattern([6, 8, 9, 10, 12, 14, 15, 16, 18, 20, 24, 25, 30]);
  const ex = v.map(exprFor);
  const { correct, wrong } = compChoices(v);
  return mc({ sec: 'quant', sub: 'comp', prompt: `Examine (A), (B), and (C) and find the best answer.<div class="abc">${ex.map((e, i) => `<div>(${L3[i]}) &nbsp; ${e}</div>`).join('')}</div>`, correct, wrong, explain: `Work out each one: (A) = ${v[0]}, (B) = ${v[1]}, (C) = ${v[2]}.` });
}
// --- Quantitative: geometric comparison (SVG figures)
const FRACS = [[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [3, 8], [5, 8], [1, 6], [5, 6], [4, 9], [5, 12], [7, 12], [3, 16], [2, 5], [3, 5]];
const GRIDS = [[2, 2], [2, 3], [3, 3], [2, 4], [3, 4], [4, 4], [2, 5], [2, 6]];
function figureSVG(n, d) {
  const kinds = [];
  GRIDS.forEach(([r, c]) => { if ((r * c) % d === 0) kinds.push({ k: 'grid', r, c, t: r * c }); });
  for (let t = Math.max(2, d); t <= 12; t += d) kinds.push({ k: 'pie', t });
  const f = pick(kinds), sh = n * f.t / d;
  const on = new Set(shuffle([...Array(f.t).keys()]).slice(0, sh));
  const fillC = i => on.has(i) ? '#38bdf8' : '#1e293b';
  let body = '';
  if (f.k === 'grid') {
    const cw = 90 / f.c, chh = 90 / f.r;
    for (let i = 0; i < f.t; i++) { const x = 5 + (i % f.c) * cw, y = 5 + Math.floor(i / f.c) * chh; body += `<rect x="${x}" y="${y}" width="${cw}" height="${chh}" fill="${fillC(i)}" stroke="#cbd5e1" stroke-width="1.5"/>`; }
  } else {
    const R = 44, C = 50;
    for (let i = 0; i < f.t; i++) {
      const a1 = (i / f.t) * 2 * Math.PI - Math.PI / 2, a2 = ((i + 1) / f.t) * 2 * Math.PI - Math.PI / 2;
      const p = (a) => `${(C + R * Math.cos(a)).toFixed(2)},${(C + R * Math.sin(a)).toFixed(2)}`;
      body += `<path d="M${C},${C} L${p(a1)} A${R},${R} 0 0 1 ${p(a2)} Z" fill="${fillC(i)}" stroke="#cbd5e1" stroke-width="1.5"/>`;
    }
  }
  return { svg: `<svg width="110" height="110" viewBox="0 0 100 100">${body}</svg>`, txt: `${sh}/${f.t}` + (fr(sh, f.t) !== `${sh}/${f.t}` ? ` = ${fr(sh, f.t)}` : '') };
}
function geoQ() {
  const vals = valuePattern(FRACS.map(([n, d]) => n / d));
  const figs = vals.map(v => { const [n, d] = FRACS.find(([a, b]) => Math.abs(a / b - v) < 1e-9); return figureSVG(n, d); });
  const { correct, wrong } = compChoices(vals);
  return mc({ sec: 'quant', sub: 'geo', prompt: `Examine figures (A), (B), and (C). Compare the <b>fraction of each figure that is shaded</b>, and find the best answer.<div class="figs">${figs.map((f, i) => `<div>${f.svg}(${L3[i]})</div>`).join('')}</div>`, correct, wrong, explain: `Shaded parts: (A) ${figs[0].txt}, (B) ${figs[1].txt}, (C) ${figs[2].txt}.` });
}

function manipQ() {
  const t = rnd(0, 7); let q, ans, exp, extra = [];
  switch (t) {
    case 0: { const k = pick([2, 3, 4, 5, 6]), m = k * rnd(3, 12), n = rnd(2, 15); ans = m / k + n; q = `What number is ${n} more than 1/${k} of ${m}?`; exp = `1/${k} of ${m} = ${m / k}; ${m / k} + ${n} = ${ans}.`; extra = [m / k - n, m + n, m / k]; break; }
    case 1: { const a = rnd(3, 12), b = rnd(3, 12), n = rnd(2, 20); ans = a * b - n; q = `What number is ${n} less than the product of ${a} and ${b}?`; exp = `${a} × ${b} = ${a * b}; ${a * b} − ${n} = ${ans}.`; extra = [a * b + n, a + b - n, a * b]; break; }
    case 2: { const k = rnd(2, 6), a = rnd(2, 10), b = rnd(2, 10); ans = k * (a + b); q = `What number divided by ${k} is equal to the sum of ${a} and ${b}?`; exp = `${a} + ${b} = ${a + b}; ${a + b} × ${k} = ${ans}.`; extra = [a + b, (a + b) + k, k * a + b]; break; }

function mix(n, subs, map) {
  const keys = shuffle(subs.filter(s => map[s])); const counts = {};
  keys.forEach(k => counts[k] = 0);
  for (let i = 0; i < n; i++) counts[keys[i % keys.length]]++;
  let out = []; for (const k of keys) if (counts[k]) out = out.concat(map[k](counts[k]));
  return shuffle(out);
}

  if (c.mock) {

const mmss = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.max(0, s) % 60).padStart(2, '0')}`;

function renderQuiz() {
  const q = Q.qs[Q.i], a = Q.ans[Q.i], inst = Q.cfg.feedback === 'instant', locked = inst && a && a.locked;

  } else {
    body += q.choices.map((c, i) => {
      let cls = '';

      else if (a && a.choice === i) cls = 'sel';

    }).join('');
  }
  if (locked) body += `<div class="fb ${a.correct ? 'ok' : 'no'}"><b>${a.correct ? pick(['✅ Correct!', '✅ Nice!', '✅ Nailed it!', '✅ You got it!']) : (q.typed ? `❌ Not quite. You typed “${esc(a.typed || '')}”. Correct: <b>${q.word}</b>` : `❌ The answer is ${LET[q.answer]}.`)}</b><br>${q.explain}</div>`;

  const isLast = Q.i === n - 1;
  let nav;
  if (inst) nav = `<span class="sp"></span>${locked ? `<button class="btn good" id="nextBtn" onclick="next()">${isLast ? 'Finish 🏁' : 'Next ▶'}</button>` : ''}`;
  else nav = `<button class="btn sec" ${Q.i === 0 ? 'disabled' : ''} onclick="Q.i--;renderQuiz()">◀ Back</button><span class="sp"></span><span class="muted small">${answeredCount}/${n} answered</span><button class="btn ${isLast ? 'good' : ''}" id="nextBtn" onclick="${isLast ? 'confirmFinish()' : 'next()'}">${isLast ? 'Finish 🏁' : 'Next ▶'}</button>`;

  $('#app').innerHTML = `<div class="card">

      ${inst ? `<span class="pill" title="Correct in a row">🔥 ${Q.streak}</span><span class="pill">✨ ${Q.xp} XP</span>` : ''}
      ${Q.cfg.timed ? `<span class="pill">⏱️ <span id="tm" class="timer ${Q.timeLeft <= 30 ? 'low' : ''}">${mmss(Q.timeLeft)}</span></span>` : ''}
      <button class="btn sec" style="padding:6px 12px;font-size:13px" onclick="confirmFinish(true)">End quiz</button></div>
    <div class="prog"><div style="width:${((Q.i + (locked ? 1 : 0)) / n) * 100}%"></div></div>

  if (q.typed && !locked) {

function hint() { const w = Q.qs[Q.i].word; $('#hint').innerHTML = `Starts with <b>${w[0].toUpperCase()}</b> and has <b>${w.length}</b> letters. Pattern: ${SPELL[Q.qs[Q.i].cat].name}.`; }
function award(correct, el) {
  if (correct) {
    Q.streak++; Q.maxStreak = Math.max(Q.maxStreak, Q.streak);
    const g = 10 + Math.min(10, 2 * Math.max(0, Q.streak - 2)) + (Q.cfg.timed ? 3 : 0);
    Q.xp += g; return g;
  }
  Q.streak = 0; return 0;
}
function choose(i) {
  const q = Q.qs[Q.i], inst = Q.cfg.feedback === 'instant';
  if (inst) {
    if (Q.ans[Q.i] && Q.ans[Q.i].locked) return;
    const correct = i === q.answer;
    Q.ans[Q.i] = { choice: i, correct, locked: true };
    const g = award(correct); correct ? sfx.ok() : sfx.no();
    renderQuiz();
    if (g) xpFloat(`+${g} XP`, document.querySelectorAll('.choice')[i]);
    if (correct && [5, 10, 15, 20, 25].includes(Q.streak)) toast(`🔥 ${Q.streak} in a row!`);

}
function submitTyped() {
  const q = Q.qs[Q.i], v = ($('#ti').value || '').trim();
  if (Q.cfg.feedback === 'end') { Q.ans[Q.i] = { typed: v }; Q.i < Q.qs.length - 1 ? next() : confirmFinish(); return; }
  if (!v || (Q.ans[Q.i] && Q.ans[Q.i].locked)) return;
  const correct = v.toLowerCase() === q.word.toLowerCase();
  Q.ans[Q.i] = { typed: v, correct, locked: true };
  const g = award(correct); correct ? sfx.ok() : sfx.no();
  renderQuiz(); if (g) xpFloat(`+${g} XP`, $('.fb'));
}
function next() { if (Q.i < Q.qs.length - 1) { Q.i++; renderQuiz(); } else finishQuiz(); }
function confirmFinish(early) {
  const un = Q.ans.filter(a => !a || (a.choice == null && !a.typed)).length;
  if ((early || un) && !confirm(early ? 'End the quiz now? Unanswered questions count as wrong.' : `You have ${un} unanswered question${un > 1 ? 's' : ''}. Finish anyway?`)) return;
  finishQuiz();
}

/* =========================================================
   FINISH / SCORING
   ========================================================= */
let R = null;
function finishQuiz() {
  if (Q.done) return;
  Q.done = true; clearInterval(Q.timer);
  const c = Q.cfg, inst = c.feedback === 'instant';
  // grade every question
  Q.qs.forEach((q, i) => {
    const a = Q.ans[i] || {};
    if (a.locked) return;
    a.correct = q.typed ? !!a.typed && a.typed.trim().toLowerCase() === q.word.toLowerCase() : a.choice === q.answer;
    Q.ans[i] = a;
    if (!inst) award(a.correct);
  });
  const total = Q.qs.length, right = Q.ans.filter(a => a.correct).length, pct = Math.round(right / total * 100);
  const lvBefore = lvl(P.xp), badgesBefore = new Set(P.badges);
  let xp = Q.xp + 10 + (pct === 100 && total >= 10 ? 50 : 0);
  P.xp += xp;
  P.answered += total;
  // per-section and per-spelling-pattern stats; mistake bank
  Q.qs.forEach((q, i) => {
    const ok = Q.ans[i].correct;
    const s = P.sec[q.sec] = P.sec[q.sec] || { c: 0, t: 0 }; s.t++; if (ok) s.c++;
    if (q.cat) { const k = P.cat[q.cat] = P.cat[q.cat] || { c: 0, t: 0 }; k.t++; if (ok) k.c++; }
    const key = qkey(q), idx = P.mistakes.findIndex(m => qkey(m) === key);
    if (ok && idx >= 0 && c.review) { P.mistakes.splice(idx, 1); P.fixed++; }
    if (!ok && idx < 0 && (Q.ans[i].choice != null || Q.ans[i].typed)) P.mistakes.push(q);
  });
  if (P.mistakes.length > 300) P.mistakes = P.mistakes.slice(-300);
  const prevBest = P.best[c.key];
  const newBest = c.key !== 'review' && (prevBest == null || pct > prevBest) && !c.fixedQs;
  if (newBest) P.best[c.key] = pct;
  if (!P.days.includes(today())) P.days.push(today());
  P.bestStreak = Math.max(P.bestStreak, Q.maxStreak);
  if (c.mock) P.done = [...new Set([...P.done, 'verbal', 'quant', 'reading', 'math', 'language'])];
  else if (SECTIONS[c.sec]) P.done = [...new Set([...P.done, c.sec])];
  P.history.unshift({ d: new Date().toISOString(), t: c.title, s: right, n: total, p: pct, timed: !!c.timed });
  P.history = P.history.slice(0, 100);
  // badges
  const earn = id => { if (!P.badges.includes(id)) P.badges.push(id); };
  earn('first');
  if (pct === 100 && total >= 10) earn('perfect');
  if (Q.maxStreak >= 10) earn('streak10');
  if (Q.maxStreak >= 25) earn('streak25');
  if (c.sec === 'spelling' && total >= 20 && pct >= 90) earn('bee');
  ['double', 'ance', 'ie'].forEach(k => { if (P.cat[k] && P.cat[k].c >= 50) earn(k); });
  if (['verbal', 'quant', 'reading', 'math', 'language'].every(s => P.done.includes(s))) earn('round');
  if (c.mock) { earn('mock'); if (pct >= 80) earn('mock80'); }
  if (c.timed && pct >= 80) earn('speed');
  if (P.fixed >= 10) earn('comeback');
  if (P.days.length >= 3) earn('days3');
  if (P.days.length >= 7) earn('days7');
  if (P.answered >= 500) earn('q500');
  if (P.xp >= 1000) earn('xp1000');
  if (P.xp >= 5000) earn('xp5000');
  save();
  R = { pct, right, total, xp, newBest, prevBest, lvUp: lvl(P.xp) > lvBefore, newBadges: P.badges.filter(b => !badgesBefore.has(b)), onlyMissed: false, maxStreak: Q.maxStreak };
  go('results');
  if (pct >= 90 || R.lvUp) confetti();
  R.lvUp ? sfx.up() : sfx.done();
}
function renderResults() {
  const { pct, right, total, xp } = R;
  const stars = pct >= 90 ? 3 : pct >= 75 ? 2 : pct >= 60 ? 1 : 0;
  const msg = pct === 100 ? 'PERFECT SCORE! You\'re unstoppable! 💎' : pct >= 90 ? 'Outstanding work! 🌟' : pct >= 75 ? 'Great job — keep it up! 💪' : pct >= 60 ? 'Good effort! Review your mistakes and try again. 📈' : 'Every expert was once a beginner. Review and retry! 🚀';
  const missed = Q.qs.map((q, i) => ({ q, a: Q.ans[i], i })).filter(x => !x.a.correct);
  const list = (R.onlyMissed ? missed : Q.qs.map((q, i) => ({ q, a: Q.ans[i], i }))).map(({ q, a, i }) => {
    const yours = q.typed ? (a.typed ? esc(a.typed) : '<i>no answer</i>') : (a.choice != null ? `${LET[a.choice]}. ${q.choices[a.choice]}` : '<i>no answer</i>');
    const corr = q.typed ? q.word : `${LET[q.answer]}. ${q.choices[q.answer]}`;
    return `<div class="rev ${a.correct ? 'ok' : 'no'}"><div class="small muted">#${i + 1} · ${SECNAME(q.sec)} ${a.correct ? '✅' : '❌'}</div>
      <div style="margin:4px 0">${q.typed ? 'Spell: ' + esc(q.sentence) : q.prompt}</div>
      ${a.correct ? `<div class="small">Your answer: ${yours}</div>` : `<div class="small" style="color:#fca5a5">Your answer: ${yours}</div><div class="small" style="color:#86efac">Correct: ${corr}</div>`}
      <div class="small muted" style="margin-top:4px">${q.explain}</div></div>`;
  }).join('');
  $('#app').innerHTML = `<div class="card" style="text-align:center">
      <div class="tag">${Q.cfg.title}</div>
      <div class="stars">${'⭐'.repeat(stars)}${'<span style="opacity:.2">⭐</span>'.repeat(3 - stars)}</div>
      <div class="big">${pct}%</div>
      <div class="muted">${right} of ${total} correct · best streak 🔥 ${R.maxStreak}</div>
      <h3 style="margin-top:12px">${msg}</h3>
      <div class="row" style="justify-content:center;margin:12px 0">
        <span class="pill">✨ +${xp} XP</span>
        ${R.newBest ? `<span class="pill" style="border-color:var(--gold)">🏆 New personal best!${R.prevBest != null ? ` (was ${R.prevBest}%)` : ''}</span>` : ''}
        ${R.lvUp ? `<span class="pill" style="border-color:var(--purple)">🎉 Level up! Now Lv ${lvl(P.xp)} · ${title(lvl(P.xp))}</span>` : ''}
      </div>
      ${R.newBadges.length ? `<div style="margin:10px 0"><b>New badge${R.newBadges.length > 1 ? 's' : ''} unlocked!</b><div class="badges" style="margin-top:8px">${R.newBadges.map(id => { const b = BADGES.find(x => x.id === id); return `<div class="badge"><div class="bi">${b.i}</div><b>${b.n}</b><div class="small muted">${b.d}</div></div>`; }).join('')}</div></div>` : ''}
      <div class="row" style="justify-content:center;margin-top:14px">
        ${missed.length ? `<button class="btn warn" onclick="retryMissed()">🔁 Retry ${missed.length} missed</button>` : ''}
        <button class="btn good" onclick="startQuiz(Object.assign({},lastCfg,{fixedQs:null}))">🎲 Try again (new questions)</button>
        <button class="btn sec" onclick="go('home')">🏠 Home</button>
      </div></div>
    <div class="card" style="margin-top:14px">
      <div class="row"><h3>Review answers</h3><span class="sp"></span>
        <button class="chip ${!R.onlyMissed ? 'on' : ''}" onclick="R.onlyMissed=false;renderResults()">All (${total})</button>
        <button class="chip ${R.onlyMissed ? 'on' : ''}" onclick="R.onlyMissed=true;renderResults()">Missed (${missed.length})</button></div>
      ${list || '<p class="muted">Nothing missed — amazing!</p>'}</div>`;
}
function retryMissed() {
  const qs = Q.qs.filter((q, i) => !Q.ans[i].correct).map(q => {
    q = JSON.parse(JSON.stringify(q));
    if (q.shuf) { const c = q.choices[q.answer]; q.choices = shuffle(q.choices); q.answer = q.choices.indexOf(c); }
    return q;
  });
  const base = lastCfg;
  startQuiz(Object.assign({}, base, { fixedQs: qs, n: qs.length, title: base.title + ' · Retry', key: base.key + '-retry' }));
  lastCfg = base;
}

/* =========================================================
   STATS
   ========================================================= */
function renderStats() {
  const tot = Object.values(P.sec).reduce((a, s) => ({ c: a.c + s.c, t: a.t + s.t }), { c: 0, t: 0 });
  const bar = (label, s, color) => { const p = s && s.t ? Math.round(s.c / s.t * 100) : 0; return `<div class="row" style="margin:6px 0"><div style="width:190px">${label}</div><div class="bar"><div style="width:${p}%;background:${color}"></div></div><div style="width:110px;text-align:right" class="small">${s && s.t ? `${p}% (${s.c}/${s.t})` : '—'}</div></div>`; };
  const n = lvl(P.xp);
  $('#app').innerHTML = `
    <div class="card"><div class="row"><div style="font-size:44px">🎓</div><div><h2>${esc(P.name || 'Student')}</h2><div class="muted">Level ${n} · ${title(n)} · ${fmt(P.xp)} XP · ${fmt(100 * n - (P.xp - 50 * (n - 1) * n))} XP to next level</div></div></div>
      <div class="grid" style="margin-top:14px">
        <div class="card" style="text-align:center"><div class="big" style="font-size:36px">${tot.t ? Math.round(tot.c / tot.t * 100) : 0}%</div><div class="muted small">Overall accuracy</div></div>
        <div class="card" style="text-align:center"><div class="big" style="font-size:36px">${fmt(P.answered)}</div><div class="muted small">Questions answered</div></div>
        <div class="card" style="text-align:center"><div class="big" style="font-size:36px">🔥 ${P.bestStreak}</div><div class="muted small">Best answer streak</div></div>
        <div class="card" style="text-align:center"><div class="big" style="font-size:36px">${P.days.length}</div><div class="muted small">Days practiced</div></div>
      </div></div>
    <div class="card" style="margin-top:14px"><h3>Accuracy by section</h3>
      ${Object.entries(SECTIONS).map(([k, s]) => bar(`${s.icon} ${s.name}`, P.sec[k], '#38bdf8')).join('')}
      ${bar('🐝 Spelling Lab', P.sec.spelling, '#fbbf24')}
      <h3 style="margin-top:16px">Spelling patterns</h3>
      ${Object.entries(SPELL).map(([k, s]) => bar(`${s.icon} ${s.name}`, P.cat[k], '#a78bfa')).join('')}</div>
    <div class="card" style="margin-top:14px"><h3>Badges (${P.badges.length}/${BADGES.length})</h3>
      <div class="badges">${BADGES.map(b => `<div class="badge ${P.badges.includes(b.id) ? '' : 'locked'}"><div class="bi">${b.i}</div><b>${b.n}</b><div class="small muted">${b.d}</div></div>`).join('')}</div></div>
    <div class="card" style="margin-top:14px"><h3>Recent quizzes</h3>
      ${P.history.length ? `<table><tr><th>Date</th><th>Quiz</th><th>Score</th><th></th></tr>${P.history.slice(0, 20).map(h => `<tr><td>${new Date(h.d).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</td><td>${esc(h.t)}</td><td><b style="color:${h.p >= 80 ? 'var(--good)' : h.p >= 60 ? 'var(--gold)' : 'var(--bad)'}">${h.p}%</b> <span class="muted small">(${h.s}/${h.n})</span></td><td>${h.timed ? '⏱️' : ''}</td></tr>`).join('')}</table>` : '<p class="muted">No quizzes yet.</p>'}</div>
    <div class="row" style="margin-top:14px"><button class="btn sec" onclick="go('home')">← Home</button><span class="sp"></span>
      <button class="btn sec" onclick="const v=prompt('Change name:',P.name);if(v&&v.trim()){P.name=v.trim();save();go('stats')}">✏️ Change name</button>
      <button class="btn danger" onclick="if(confirm('Reset ALL progress, XP, badges and history? This cannot be undone.')){P=defaultP();save();go('home')}">Reset progress</button></div>`;
}

/* =========================================================
   KEYBOARD
   ========================================================= */
document.addEventListener('keydown', e => {
  if (screen !== 'quiz' || !Q || Q.done) return;
  if (e.target.tagName === 'INPUT') return;
  const q = Q.qs[Q.i]; if (!q) return;
  const k = e.key.toLowerCase();
  const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'abcd'.indexOf(k);
  if (!q.typed && idx >= 0 && idx < q.choices.length) { choose(idx); e.preventDefault(); }
  else if (e.key === 'Enter') { const b = $('#nextBtn'); if (b) { b.click(); e.preventDefault(); } }
});

renderHeader();
renderHome();
</script>
</body>
</html>
